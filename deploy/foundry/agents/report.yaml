apiVersion: foundry.microsoft.com/v1
kind: AgentManifest
metadata:
  name: report
spec:
  role: report
  runtime:
    module: submission_evaluation.agents.report
    class: ReportAgent
  resources:
    cpuMillicores: 500
    memoryMiB: 768
    tpm: 70000
  healthCheck:
    endpoint: /health/report
    type: command
    command:
      - python
      - -m
      - submission_evaluation.main
      - --discover-agents
    intervalSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  environment:
    required:
      - INPUT_DIR
      - OUTPUT_DIR
      - AZURE_OPENAI_ENDPOINT
      - AZURE_OPENAI_DEPLOYMENT
      - AZURE_OPENAI_API_VERSION
    secrets:
      - AZURE_OPENAI_API_KEY
